const BOOKS = [
 ["Кочевники заката","Килиан Монд",[0,1,1,0,3,1],"Ты живёшь так, как дышит степь — широко и без оглядки. Тебе тесно в рамках, и люди тянутся к твоей свободе, как к костру в холодной ночи.","Ты — ветер, который не признаёт границ",["#d9822b","#8a3b12"]],
 ["Клуб убийств по четвергам","Ричард Осман",[2,1,1,3,0,3],"Ты собираешь людей вокруг себя, и с тобой уютно даже тем, кто только что познакомился. В тебе есть ирония, доброта и чуть-чуть детектива: ты замечаешь то, что другие пропускают.","Ты — уют, у которого есть план",["#b5651d","#5e2f0d"]],
 ["Мост короля Людовика Святого","Торнтон Уайлдер",[1,2,3,0,1,1],"Ты видишь невидимые нити между людьми и событиями. За каждым случайным совпадением ты читаешь смысл, и это делает тебя мудрым собеседником и внимательным другом.","Ты — тот(та), кто умеет читать судьбы",["#2f5d8a","#12263f"]],
 ["Консультант","Сон Сун Им",[3,1,2,0,0,0],"За твоим спокойствием скрывается стратег. Ты знаешь больше, чем говоришь, и всегда держишь ситуацию под контролем — тихо, элегантно, без лишних движений.","Ты — спокойствие, у которого есть план",["#3d4f5c","#151e25"]],
 ["Библиотекарь","Михаил Елизаров",[1,1,3,1,2,1],"В тебе живёт сила слова. Ты умеешь читать между строк и понимать, что книги — это не про сюжет, а про власть и память. Люди считают тебя глубже, чем ты себя показываешь.","Ты — тот(та), в чьих руках книга превращается в силу",["#7b1e2b","#3a0a12"]],
 ["Расстояния","Марсель Тири",[0,3,1,1,0,3],"Ты умеешь любить бережно — на расстоянии, письмами, взглядами. Твоя нежность не требует громких слов, и именно поэтому она так цела.","Ты — нежность, которая умеет ждать",["#c98a8a","#7a3e4a"]],
 ["Йеллоуфейс","Ребекка Куанг",[1,1,3,2,2,0],"Ты ироничен(на), амбициозен(на) и никогда не играешь по чужим правилам. Ты видишь, где мир притворяется, — и говоришь об этом с улыбкой, которая ранит точнее сарказма.","Ты — ирония, которая видит всё насквозь",["#d8a81f","#7a5a05"]],
 ["Избранник","Томас Манн",[1,2,2,1,1,2],"В тебе есть врождённая чистота и вера в добро. Ты не циничен(на) даже тогда, когда это было бы проще, и твоя простота — не наивность, а высшая форма честности.","Ты — тот(та), кого мир выбирает",["#9aa88a","#4a5a40"]],
 ["Гедда Габлер","Генрик Ибсен",[1,3,2,0,2,0],"Ты не терпишь полумер. Твой характер — как драма Ибсена: сильный, честный до жёсткости, без декораций. С тобой невозможно скучать и невозможно не считаться.","Ты — сила, которая не просит разрешения",["#8c1c1c","#2b0707"]],
 ["Дверь в лето","Роберт Хайнлайн",[0,1,2,2,3,2],"Ты оптимист с инженерной жилкой. Любое «невозможно» ты читаешь как «пока не придумали как». И, как герой Хайнлайна, ты веришь: лучшее всегда впереди — осталось только открыть дверь.","Ты — тот(та), кто всегда найдёт дверь в лето",["#e0b44c","#a8541a"]],
 ["Красная штора Болоньи","Джон Бёрджер",[1,2,3,0,1,1],"У тебя зоркий взгляд. Ты умеешь видеть прекрасное в обычном — в красной шторе, в жесте, в свете на улице. Твоё внимание — подарок для тех, кто рядом.","Ты — тот(та), кто умеет смотреть",["#b23a3a","#5a1515"]],
 ["Записки тверского дворника","Сергей Олешко",[0,2,0,3,1,3],"Ты человек с почвой под ногами и иронией в кармане. Ты видишь поэзию в повседневности и умеешь рассказать про обычный день так, что все смеются, а потом задумываются.","Ты — юмор, у которого корни в родной земле",["#a38b5c","#4f3f1f"]],
 ["Кадавры","Алексей Поляринов",[2,0,3,2,2,0],"Ты человек слова, живущий в потоке текстов и смыслов. Ты адаптируешься к любой эпохе и любому интерфейсу, но внутри — свой невидимый миру черновик.","Ты — тот(та), кто пишет мир заново",["#4a4a6a","#17172b"]],
 ["Моя мама — уборщица","Чжан Сяомань",[0,3,1,1,0,3],"Твоя главная сила — вера и любовь к близким. Ты умеешь гордиться теми, кого выбрало сердце, и не менять эту гордость ни на какие высоты.","Ты — любовь, которая не считает должностей",["#d4876b","#8a3f2a"]],
 ["Не отпускай меня","Кадзуо Исигуро",[2,3,2,0,0,1],"Ты тихая глубина. Ты ценишь мгновения, помнишь голоса и запахи и умеешь говорить о главном без единого громкого слова.","Ты — память, которая умеет быть нежной",["#6f8f9a","#27424d"]],
 ["Белая крепость","Орхан Памук",[3,1,3,0,1,1],"Ты загадка даже для себя. Тебя тянет к вопросам, у которых нет ответов, к зеркалам и двойникам. Люди уходят от тебя, задумываясь о своей жизни.","Ты — тот(та), кто и есть загадка",["#cfc3a5","#6e6247"]],
 ["Принцесса Ангина","Ролан Топор",[0,1,1,3,3,1],"Ты свободолюбивый абсурдист. Мир для тебя — театр, в котором можно переиграть любую сцену. Твой юмор — не защита, а способ летать.","Ты — свобода с искоркой абсурда",["#e07a3c","#7d2d6a"]],
 ["Площадка","Михаил Третьяков",[1,2,1,2,2,2],"Ты человек-место: вокруг тебя легко, просто и по-человечески. Ты умеешь принимать всех, какими бы они ни были, — и в этом твоя тихая суперсила.","Ты — место, где людям легко",["#7fa38a","#2f5a46"]],
 ["Ваша жестянка сломалась","Алла Горбунова",[0,2,1,2,2,1],"Ты чинишь сломанное словом. В твоей речи — поэзия повседневности: ты умеешь назвать вещи так, как их никто не называл, и это делает мир вокруг тебя чуть живее.","Ты — поэзия, которая умеет чинить",["#c08a4a","#5c3a1a"]],
 ["Игра Эндера","Орсон Скотт Кард",[2,1,3,0,2,1],"Ты стратег. Думаешь на несколько ходов вперёд, видишь доску целиком — и при этом отвечаешь за тех, кто рядом с тобой. В тебя верят, потому что ты оправдываешь веру.","Ты — тот(та), кто думает на десять ходов вперёд",["#1f3b6e","#0a1328"]],
 ["Однажды не в сказке","Катя Мерт",[1,2,0,2,2,2],"Ты мечтатель, который нашёл волшебное в обычном. Ты веришь, что сказка не закончилась — она просто поменяла адрес на твой город.","Ты — сказка, которая случилась не однажды",["#d9a05b","#7a4a2a"]],
].map((b,i)=>({id:i+1,title:b[0],author:b[1],w:b[2],text:b[3],tag:b[4],pal:b[5]}));



function compute(answers){
  const s=[0,0,0,0,0,0];
  answers.forEach((oi,qi)=>{
    const sc=QUESTIONS[qi].o[oi][1];
    for(const k in sc) s[A[k]]+=sc[k];
  });
  const ranked=BOOKS.map(b=>({b,v:b.w.reduce((a,w,i)=>a+w*s[i],0)})).sort((x,y)=>y.v-x.v);
  const top=ranked[0].v;
  const tied=ranked.filter(r=>r.v===top);
  if(tied.length>1){
    const pool=tied.length>=3?tied.slice(0,3):ranked.slice(0,3);
    return pool[Math.floor(Math.random()*pool.length)].b;
  }
  return ranked[0].b;
}

function wrap(ctx,text,x,y,maxW,lh){
  const words=text.split(" ");let line="";const lines=[];
  words.forEach(w=>{const t=line?line+" "+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w}else line=t});
  lines.push(line);
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lh));
  return lines.length*lh;
}

function drawCard(canvas,book){
  const S=1080;canvas.width=S;canvas.height=S;
  const c=canvas.getContext("2d");
  const g=c.createLinearGradient(0,0,S,S);
  g.addColorStop(0,book.pal[0]);g.addColorStop(1,book.pal[1]);
  c.fillStyle=g;c.fillRect(0,0,S,S);
  c.strokeStyle="rgba(255,248,230,.55)";c.lineWidth=3;c.strokeRect(50,50,S-100,S-100);
  c.strokeStyle="rgba(255,248,230,.25)";c.lineWidth=1.5;c.strokeRect(66,66,S-132,S-132);
  c.fillStyle="#fff6e0";c.textAlign="center";
  c.font="500 28px Lora, serif";
  c.fillText("Какая ты книга — 2026? · Книжный клуб",S/2,140);
  c.font="700 76px 'Playfair Display', serif";
  let size=76;
  const maxW=S-250;
  c.font=`700 ${size}px 'Playfair Display', serif`;
  const title="«"+book.title+"»";
  // approximate height
  const lh=92;
  const tmp=document.createElement("canvas").getContext("2d");
  tmp.font=c.font;
  const words=title.split(" ");let n=1,l="";
  words.forEach(w=>{const t=l?l+" "+w:w;if(tmp.measureText(t).width>maxW&&l){n++;l=w}else l=t});
  const th=n*lh;
  const startY=S/2-th/2-60;
  const h=wrap(c,title,S/2,startY,maxW,lh);
  c.font="italic 500 40px 'Playfair Display', serif";
  c.fillStyle="rgba(255,246,224,.9)";
  c.fillText(book.author,S/2,startY+h+20);
  c.fillStyle="rgba(255,246,224,.6)";c.fillRect(S/2-50,startY+h+60,100,3);
  c.fillStyle="#fff6e0";
  c.font="500 44px 'Playfair Display', serif";
  wrap(c,"«"+book.tag+"»",S/2,startY+h+140,S-260,60);
  c.font="500 26px Lora, serif";c.fillStyle="rgba(255,246,224,.8)";
  c.fillText("20 книг · 2026",S/2,S-120);
}

function Quiz({onDone}){
  const [i,setI]=useState(0);
  const [ans,setAns]=useState([]);
  const q=QUESTIONS[i];
  const pick=oi=>{
    const a=[...ans,oi];
    if(i+1===QUESTIONS.length) onDone(a);
    else{setAns(a);setI(i+1)}
  };
  return (
    <div className="max-w-2xl mx-auto px-5 py-10 md:py-16" key={i}>
      <div className="fade">
        <div className="flex items-center gap-3 mb-8">
          <span className="text-sm tracking-widest" style={{color:"#8a3b12"}}>{i+1} / {QUESTIONS.length}</span>
          <div className="flex-1 h-1.5 rounded-full" style={{background:"#d6c4a0"}}>
            <div className="h-full rounded-full" style={{width:((i+1)/QUESTIONS.length*100)+"%",background:"#8a3b12",transition:"width .3s"}}></div>
          </div>
        </div>
        <h2 className="serif text-3xl md:text-4xl font-bold leading-snug mb-8" style={{color:"#3b2a1c"}}>{q.q}</h2>
        <div className="grid gap-3">
          {q.o.map((o,oi)=>(
            <button key={oi} onClick={()=>pick(oi)} className="opt text-left rounded-xl px-5 py-4 text-base md:text-lg flex gap-4 items-start">
              <span className="serif font-bold opacity-60">{"АБВГ"[oi]}</span><span>{o[0]}</span>
            </button>
          ))}
        </div>
        {i>0&&<button onClick={()=>{setI(i-1);setAns(ans.slice(0,-1))}} className="mt-6 text-sm" style={{color:"#6b4a2b"}}><i className="fa-solid fa-arrow-left mr-2"></i>Назад</button>}
      </div>
    </div>
  );
}

function Result({book,onRetry}){
  const ref=useRef();
  const [toast,setToast]=useState("");
  useEffect(()=>{
    const draw=()=>drawCard(ref.current,book);
    draw();
    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(draw);
  },[book]);
  const share=()=>{
    const url=encodeURIComponent(location.href.split("#")[0]);
    const title=encodeURIComponent(`Я — «${book.title}». ${book.tag}. Какая ты книга — 2026?`);
    window.open(`https://vk.com/share.php?url=${url}&title=${title}`,"_blank");
  };
  const download=()=>{
    const a=document.createElement("a");
    a.href=ref.current.toDataURL("image/png");
    a.download=`kniga-2026-${book.id}.png`;a.click();
    setToast("Картинка сохранена");setTimeout(()=>setToast(""),2000);
  };
  return (
    <div className="max-w-3xl mx-auto px-5 py-10 md:py-14 fade">
      <p className="text-sm tracking-[.3em] uppercase text-center mb-4" style={{color:"#8a3b12"}}>Твой результат</p>
      <h1 className="serif text-4xl md:text-6xl font-extrabold text-center leading-tight" style={{color:"#3b2a1c"}}>Ты — «{book.title}»</h1>
      <p className="serif italic text-xl md:text-2xl text-center mt-3" style={{color:"#6b4a2b"}}>{book.author}</p>
      <p className="mt-8 text-lg md:text-xl leading-relaxed text-center max-w-2xl mx-auto" style={{color:"#3b2a1c"}}>{book.text}</p>
      <p className="serif text-2xl md:text-3xl font-bold text-center mt-8" style={{color:book.pal[1]}}>«{book.tag}»</p>
      <div className="mt-10 mx-auto" style={{maxWidth:460}}>
        <canvas ref={ref} className="w-full rounded-lg" style={{aspectRatio:"1/1",boxShadow:"0 8px 24px rgba(59,42,28,.25)"}}></canvas>
      </div>
      <div className="mt-8 flex flex-col sm:flex-row gap-3 justify-center">
        <button onClick={share} className="btn px-6 py-3 rounded-full font-semibold" style={{background:"#3b2a1c",color:"#f5ecd9"}}>
          <i className="fa-brands fa-vk mr-2"></i>Поделиться в ВК
        </button>
        <button onClick={download} className="btn px-6 py-3 rounded-full font-semibold" style={{background:"#8a3b12",color:"#fff6e0"}}>
          <i className="fa-solid fa-download mr-2"></i>Скачать картинку
        </button>
        <button onClick={onRetry} className="btn px-6 py-3 rounded-full font-semibold" style={{border:"1.5px solid #3b2a1c",color:"#3b2a1c"}}>
          <i className="fa-solid fa-rotate-right mr-2"></i>Пройти ещё раз
        </button>
      </div>
      <div className="h-8 text-center mt-4 text-sm" style={{color:"#6b4a2b"}}>{toast}</div>
    </div>
  );
}


function App(){
  const [view,setView]=useState("intro");
  const [book,setBook]=useState(null);
  const done=a=>{const b=compute(a);setBook(b);setView("result");window.scrollTo(0,0)};
  return (
    <div className="min-h-screen">
      <Header onHome={()=>setView("intro")}/>
      {view==="intro"&&<Intro onStart={()=>setView("quiz")}/>}
      {view==="quiz"&&<Quiz onDone={done}/>}
      {view==="result"&&<Result book={book} onRetry={()=>setView("quiz")}/>}

      <footer className="text-center text-xs py-8" style={{color:"#8a6b48"}}>21 книга · 2026</footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
